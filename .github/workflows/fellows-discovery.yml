# Compare Leon's fellow catalog against released upstream configuration sources.
# These network/source checks are platform-independent, so run them only on Linux.
# Native discovery behavior is covered separately by the build workflow.
name: Fellows discovery

on:
  schedule:
    - cron: '17 7 * * 1'
  workflow_dispatch:
  pull_request:
    paths:
      - 'server/src/core/llm-manager/fellows/**'
      - 'scripts/ci/check-fellows-discovery.js'
      - '.github/workflows/fellows-discovery.yml'

permissions:
  contents: read

jobs:
  upstream-config-locations:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version-file: .nvmrc
      - name: Check released upstream config locations
        run: node scripts/ci/check-fellows-discovery.js
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - name: Save discovery report
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: fellows-discovery-report
          path: fellows-discovery-report.json
          if-no-files-found: error
