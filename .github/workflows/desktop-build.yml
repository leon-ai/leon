name: Desktop build and tests

on:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  # A manual check of a tag must not cancel that tag's release verification.
  group: desktop-build-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Desktop (${{ matrix.platform }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - { platform: darwin-arm64, runner: macos-latest }
          - { platform: linux-x64, runner: ubuntu-latest }
          - { platform: linux-arm64, runner: ubuntu-24.04-arm }
          - { platform: win32-x64, runner: windows-latest }
    env:
      CI: 'true'
      # Verification packages are unsigned and never publish or enable updates.
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'

    steps:
      - uses: actions/checkout@v7.0.1
      - uses: pnpm/action-setup@v6.1.1
        with:
          run_install: false
      - uses: actions/setup-node@v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      # Layered icon compilation needs a macOS 26 host and a known Xcode compiler.
      - name: Use Xcode for native icons
        if: runner.os == 'macOS'
        env:
          DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
        run: |
          xcrun actool --version
          echo "DEVELOPER_DIR=$DEVELOPER_DIR" >> "$GITHUB_ENV"

      # The host uses bundled server leaves, not server setup or Python tooling.
      - name: Install build dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Install desktop dependencies
        run: pnpm --filter leon-desktop install --frozen-lockfile --ignore-scripts
      - name: Check desktop lint and types
        if: matrix.platform == 'linux-x64'
        run: pnpm run lint --scope desktop
      - name: Check desktop host lifecycle and updates
        run: pnpm run test:desktop
      - name: Build desktop application
        run: pnpm run build:desktop
      - name: Build packaged desktop for automation
        run: pnpm --filter leon-desktop build:diagnostics
      - name: Install test browser
        if: runner.os != 'Linux'
        run: node apps/desktop/scripts/install-test-browser.mjs
      - name: Run desktop owner flows
        if: runner.os != 'Linux'
        run: pnpm run test:desktop:e2e
      - name: Run Linux owner flows
        if: runner.os == 'Linux'
        shell: bash
        run: |
          pnpm exec playwright install-deps chromium
          node apps/desktop/scripts/install-test-browser.mjs
          if [[ -r /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]] &&
             [[ $(cat /proc/sys/kernel/apparmor_restrict_unprivileged_userns) == 1 ]]; then
            binary=$(node -p 'const b = require("./apps/desktop/.artifacts/diagnostics-build.json"); require("node:path").join(b.output, b.executableName)')
            policy="$RUNNER_TEMP/leon-desktop-e2e.apparmor"
            printf 'abi <abi/4.0>,\ninclude <tunables/global>\nprofile leon-desktop-e2e "%s" flags=(unconfined) {\n  userns,\n}\n' "$binary" > "$policy"
            sudo apparmor_parser --replace "$policy"
          fi
          xvfb-run -a pnpm run test:desktop:e2e
          pnpm run test:web-app:e2e e2e/connections.spec.ts e2e/attachments.spec.ts -g 'returns from|selects multiple files'
      - name: Retain owner-flow diagnostics
        if: failure()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: desktop-owner-flows-${{ matrix.platform }}
          path: |
            apps/desktop/.artifacts/e2e
            test/web-app/results
