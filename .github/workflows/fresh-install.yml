# Exercise cold installations and live DeepSeek local shell/OCR turns on all three OSes.
# Linux also verifies interactive setup; Windows/macOS install without prompts.
# Do not restore dependency/profile caches or repeat the discovery/regression suites.
name: Fresh installation

on:
  workflow_call:
    inputs:
      verify-ota:
        description: Verify the release upgrade on Linux
        type: boolean
        default: false
    secrets:
      LEON_DEEPSEEK_API_KEY:
        required: true
  schedule:
    # Space the three weekly runs exactly 56 hours apart (UTC).
    - cron: '17 4 * * 1'
    - cron: '17 12 * * 3'
    - cron: '17 20 * * 5'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fresh-install-${{ github.ref }}
  cancel-in-progress: false

jobs:
  fresh-install:
    name: ${{ inputs.verify-ota && 'Fresh installation and OTA (Linux)' || 'Fresh installation (Linux)' }}
    runs-on: ${{ inputs.verify-ota && 'ubuntu-24.04' || 'ubuntu-latest' }}
    timeout-minutes: ${{ inputs.verify-ota && 180 || 90 }}

    steps:
      # Scheduled workflows are loaded from the default branch, but Leon's
      # integration work lands on develop before it reaches a release branch.
      - name: Check out Leon
        uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.event_name == 'schedule' && 'develop' || github.ref }}
          fetch-depth: ${{ inputs.verify-ota && '0' || '1' }}

      - name: Use Node.js
        uses: actions/setup-node@v7.1.0
        with:
          node-version-file: .nvmrc
          check-latest: true
          package-manager-cache: false

      - name: Install latest pnpm
        uses: pnpm/action-setup@v6.1.1
        with:
          version: latest
          run_install: false

      - name: Test installation and DeepSeek inferences
        env:
          LEON_FRESH_INSTALL_API_KEY: ${{ secrets.LEON_DEEPSEEK_API_KEY }}
          LEON_FRESH_INSTALL_LOG_PATH: /tmp/leon-fresh-install.log
          LEON_HOME: ${{ runner.temp }}/leon-fresh-install
          pnpm_config_store_dir: ${{ runner.temp }}/leon-fresh-pnpm-store
          UV_CACHE_DIR: ${{ runner.temp }}/leon-fresh-uv-cache
        run: node scripts/ci/test-fresh-install.js

      - name: Package and verify prebuilt server
        if: inputs.verify-ota
        env:
          LEON_HOME: ${{ runner.temp }}/leon-fresh-install
          LEON_FRESH_INSTALL_API_KEY: ${{ secrets.LEON_DEEPSEEK_API_KEY }}
          GH_TOKEN: ${{ github.token }}
        run: |
          node scripts/distribution/build-runtime.js "${{ runner.temp }}/leon-runtime"
          node scripts/distribution/verify-runtime.js "${{ runner.temp }}/leon-runtime"
          node scripts/distribution/verify-runtime-ota.js "${{ runner.temp }}/leon-runtime"

      - name: Retain verified server archive
        if: inputs.verify-ota
        uses: actions/upload-artifact@v7.0.2
        with:
          name: core-runtime-${{ runner.os }}-${{ runner.arch }}
          path: ${{ runner.temp }}/leon-runtime
          if-no-files-found: error
          retention-days: 7

      - name: Verify release OTA and prepare publication
        if: inputs.verify-ota
        env:
          GH_TOKEN: ${{ github.token }}
          LEON_FRESH_INSTALL_API_KEY: ${{ secrets.LEON_DEEPSEEK_API_KEY }}
          LEON_HOME: ${{ runner.temp }}/leon-ota
          LEON_PROFILE: ota-ci
          LEON_OTA_LOG_PATH: ${{ runner.temp }}/leon-ota.log
          LEON_RELEASE_OUTPUT: ${{ runner.temp }}/leon-release
          pnpm_config_store_dir: ${{ runner.temp }}/leon-fresh-pnpm-store
          UV_CACHE_DIR: ${{ runner.temp }}/leon-fresh-uv-cache
        run: pnpm exec tsx scripts/ci/test-release-ota.ts

      - name: Retain verified release content
        if: inputs.verify-ota
        uses: actions/upload-artifact@v7.0.2
        with:
          name: verified-release
          path: ${{ runner.temp }}/leon-release
          if-no-files-found: error
          retention-days: 7

      - name: Upload installer log on failure
        if: failure()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: fresh-install-log
          path: |
            /tmp/leon-fresh-install.log
            ${{ runner.temp }}/leon-ota.log
          if-no-files-found: ignore
          retention-days: 7

  platform-install:
    name: Fresh installation (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        # Releases build on native, versioned images; routine checks follow latest.
        os: ${{ fromJSON(inputs.verify-ota && '["macos-15", "windows-2022", "ubuntu-24.04-arm"]' || '["macos-latest", "windows-latest"]') }}

    steps:
      - name: Check out Leon
        uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.event_name == 'schedule' && 'develop' || github.ref }}

      - name: Use Node.js
        uses: actions/setup-node@v7.1.0
        with:
          node-version-file: .nvmrc
          check-latest: true
          package-manager-cache: false

      - name: Install latest pnpm
        uses: pnpm/action-setup@v6.1.1
        with:
          version: latest
          run_install: false

      # Use the owner's installer, including managed runtimes, without the CI
      # shortcuts. Hosted runners have no interactive terminal for setup prompts.
      - name: Install and build from scratch
        env:
          LEON_HOME: ${{ runner.temp }}/leon-fresh-install
          pnpm_config_store_dir: ${{ runner.temp }}/leon-fresh-pnpm-store
          UV_CACHE_DIR: ${{ runner.temp }}/leon-fresh-uv-cache
        run: |
          node --input-type=module -e "
            import fs from 'node:fs';
            import { spawnSync } from 'node:child_process';
            import { getFullInstallEnvironment } from './scripts/setup/setup-ci.js';
            for (const directory of ['node_modules', process.env.LEON_HOME, process.env.pnpm_config_store_dir, process.env.UV_CACHE_DIR]) {
              if (fs.existsSync(directory) && fs.readdirSync(directory).length > 0) {
                throw new Error('Fresh installation requires an empty directory: ' + directory);
              }
            }
            const env = getFullInstallEnvironment();
            // Package-manager actions can expose pnpm through a Windows command shim.
            const isWindows = process.platform === 'win32';
            const command = isWindows ? process.env.ComSpec || 'cmd.exe' : 'pnpm';
            const args = [...(isWindows ? ['/d', '/s', '/c', 'pnpm'] : []), 'install', '--frozen-lockfile'];
            const result = spawnSync(command, args, { env, stdio: 'inherit', windowsHide: true });
            if (result.error) {
              throw result.error;
            }
            process.exit(result.status ?? 1);
          "

      - name: Verify installed server and DeepSeek inferences
        env:
          LEON_HOME: ${{ runner.temp }}/leon-fresh-install
          pnpm_config_store_dir: ${{ runner.temp }}/leon-fresh-pnpm-store
          UV_CACHE_DIR: ${{ runner.temp }}/leon-fresh-uv-cache
          LEON_FRESH_INSTALL_API_KEY: ${{ secrets.LEON_DEEPSEEK_API_KEY }}
          LEON_FRESH_INSTALL_LOG_PATH: ${{ runner.temp }}/leon-fresh-inferences.log
        run: node scripts/ci/test-fresh-install.js --verify

      - name: Package and verify prebuilt server
        if: inputs.verify-ota
        env:
          LEON_HOME: ${{ runner.temp }}/leon-fresh-install
          LEON_FRESH_INSTALL_API_KEY: ${{ secrets.LEON_DEEPSEEK_API_KEY }}
          GH_TOKEN: ${{ github.token }}
        run: |
          node scripts/distribution/build-runtime.js "${{ runner.temp }}/leon-runtime"
          node scripts/distribution/verify-runtime.js "${{ runner.temp }}/leon-runtime"
          node scripts/distribution/verify-runtime-ota.js "${{ runner.temp }}/leon-runtime"

      - name: Retain verified server archive
        if: inputs.verify-ota
        uses: actions/upload-artifact@v7.0.2
        with:
          name: core-runtime-${{ runner.os }}-${{ runner.arch }}
          path: ${{ runner.temp }}/leon-runtime
          if-no-files-found: error
          retention-days: 7

      - name: Upload inference log on failure
        if: failure()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: fresh-install-log-${{ matrix.os }}
          path: ${{ runner.temp }}/leon-fresh-inferences.log
          if-no-files-found: ignore
          retention-days: 7
