name: Lint

on:
  push:
    # branches: [master, develop]
    branches: [master]
  pull_request:
    # branches: [master, develop]
    branches: [master]

jobs:
  lint:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: Use Python
        uses: actions/setup-python@v6
        with:
          python-version: 3.x

      - name: Read pnpm version
        id: versions
        run: |
          echo "pnpm=$(jq -r '.devEngines.packageManager.version' package.json)" >> "$GITHUB_OUTPUT"

      # Install pnpm before setup-node restores its package cache.
      - name: Install pnpm
        uses: pnpm/action-setup@v5
        with:
          version: ${{ steps.versions.outputs.pnpm }}
          run_install: false

      - name: Use Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          check-latest: true
          cache: pnpm

      - name: Install
        run: pnpm install

      - name: Run linter
        run: pnpm run lint
